<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#003b71">
    <title>Sasol Airtime</title>
    <style>
      :root{--blue:#003b71;--cyan:#00a8e0;--yellow:#ffcb05;--ink:#153454;--muted:#688297;--line:#d6e6ef;--mist:#f1f8fc}*{box-sizing:border-box}body{min-width:320px;margin:0;background:#eaf3f8;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,560px);min-height:100vh;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));background:#fff}.top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.back{display:grid;width:40px;height:40px;place-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--blue);font-size:25px}.top h1{margin:0;color:var(--blue);font-size:19px;text-align:center}.top span{width:40px}.hero{position:relative;overflow:hidden;margin:22px 0 19px;padding:20px;border-radius:23px;background:#003b71;color:#fff;box-shadow:0 13px 28px #003b7130}.hero:after{position:absolute;right:-20px;bottom:-60px;width:160px;height:160px;border:24px solid #00a8e044;border-radius:50%;content:""}.hero p,.hero h2,.hero small{position:relative;z-index:1}.hero p{margin:0;color:#83dbff;font-size:10px;font-weight:900;letter-spacing:1.1px}.hero h2{max-width:250px;margin:8px 0 5px;font-size:27px;letter-spacing:-.8px}.hero small{color:#d3effb;font-size:12px}.card{padding:17px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 18px #003b710c}.label{display:block;margin-bottom:7px;color:#647b8f;font-size:10px;font-weight:900;letter-spacing:.7px}.phone{display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfe}.phone b{color:var(--blue)}.phone input{width:100%;padding:14px 0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}.providers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.provider{min-height:55px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#526f82;font-size:10px;font-weight:850}.provider.active{border-color:#1aa6df;background:#effaff;color:var(--blue)}.provider b{display:block;font-size:13px}.provider small{font-size:9px}.section{margin-top:23px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.section h2{margin:0;color:var(--blue);font-size:18px}.section-head span{color:var(--muted);font-size:11px;font-weight:750}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.amount{padding:13px 7px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue);font-size:14px;font-weight:850}.amount.active{border-color:#e2ad00;background:#fff9dd;color:#805e00}.summary{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding:15px 16px;border-radius:16px;background:var(--mist)}.summary small{display:block;color:var(--muted);font-size:10px;font-weight:750}.summary b{display:block;margin-top:4px;color:var(--blue);font-size:16px}.summary strong{color:var(--blue);font-size:20px}.buy{width:100%;margin-top:13px;padding:15px;border:0;border-radius:13px;background:var(--blue);box-shadow:0 9px 17px #003b7130;color:#fff;font-size:15px;font-weight:900}.notice,.success{margin-top:16px;padding:14px;border-radius:15px;font-size:11px;line-height:1.45}.notice{background:#eff8fc;color:#59758a}.notice b{color:var(--blue)}.success{display:none;border:1px solid #bde5d4;background:#f1fbf6;color:#23694f;font-size:13px}.success.show{display:block}.success b{display:block;margin-bottom:3px;color:#146944}@media(max-width:370px){.app{padding-right:13px;padding-left:13px}.providers{gap:5px}.provider{font-size:9px}}
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top"><button class="back" id="back" type="button" aria-label="Back">‹</button><h1 id="page-title">Airtime</h1><span></span></header>
      <section class="hero"><p id="hero-kicker">MOBILE AIRTIME</p><h2 id="hero-title">Recharge your way.</h2><small id="hero-copy">Buy airtime for any South African mobile number.</small></section>
      <section class="card"><label class="label" for="phone">MOBILE NUMBER</label><div class="phone"><b>+27</b><input id="phone" type="tel" inputmode="numeric" placeholder="71 234 5678" aria-label="Mobile number"></div><div class="providers"><button class="provider active" data-provider="Vodacom" type="button"><b>Vodacom</b><small>Prepaid</small></button><button class="provider" data-provider="MTN" type="button"><b>MTN</b><small>Prepaid</small></button><button class="provider" data-provider="Telkom" type="button"><b>Telkom</b><small>Mobile</small></button><button class="provider" data-provider="Cell C" type="button"><b>Cell C</b><small>Prepaid</small></button></div></section>
      <section class="section"><div class="section-head"><h2 id="amount-title">Choose airtime</h2><span>Instant recharge</span></div><div class="amounts" id="amounts"></div></section>
      <section class="summary"><span><small id="summary-kind">Airtime · Vodacom</small><b id="summary-number">Add a mobile number</b></span><strong id="summary-price">R20</strong></section><button class="buy" id="buy" type="button">Buy airtime</button>
      <p class="notice"><b>Demo environment.</b> Purchases are simulated locally. Your real balance will not be charged.</p><section class="success" id="success"><b id="success-title">Airtime sent</b><span id="success-copy"></span></section>
    </main>
    <script>
      const selectedKind=new URLSearchParams(location.search).get('kind')==='data'?'Data':'Airtime',state={kind:selectedKind,provider:'Vodacom',amount:selectedKind==='Data'?'500 MB':'R20'},bundles={Airtime:['R10','R20','R50','R100','R200','R500'],Data:['250 MB','500 MB','1 GB','2 GB','5 GB','10 GB']},prices={'250 MB':'R19','500 MB':'R29','1 GB':'R49','2 GB':'R89','5 GB':'R179','10 GB':'R299'},amounts=document.querySelector('#amounts'),phone=document.querySelector('#phone');const price=()=>state.kind==='Data'?prices[state.amount]:state.amount;function render(){document.title=`Sasol ${state.kind}`;document.querySelector('#page-title').textContent=state.kind;document.querySelector('#hero-kicker').textContent=state.kind==='Data'?'MOBILE DATA':'MOBILE AIRTIME';document.querySelector('#hero-title').textContent=state.kind==='Data'?'Stay connected.' :'Recharge your way.';document.querySelector('#hero-copy').textContent=state.kind==='Data'?'Buy a data bundle for any South African mobile number.':'Buy airtime for any South African mobile number.';document.querySelector('#amount-title').textContent=`Choose ${state.kind.toLowerCase()}`;amounts.innerHTML=bundles[state.kind].map(value=>`<button type="button" class="amount ${value===state.amount?'active':''}" data-amount="${value}">${value}</button>`).join('');document.querySelector('#summary-kind').textContent=`${state.kind} · ${state.provider}`;document.querySelector('#summary-number').textContent=phone.value.trim()?`+27 ${phone.value.trim()}`:'Add a mobile number';document.querySelector('#summary-price').textContent=price();document.querySelector('#buy').textContent=`Buy ${state.kind.toLowerCase()}`};document.querySelectorAll('[data-provider]').forEach(button=>button.onclick=()=>{state.provider=button.dataset.provider;document.querySelectorAll('[data-provider]').forEach(item=>item.classList.toggle('active',item===button));render()});amounts.onclick=event=>{const button=event.target.closest('[data-amount]');if(button){state.amount=button.dataset.amount;render()}};phone.oninput=render;document.querySelector('#buy').onclick=()=>{const number=phone.value.replace(/\D/g,'');if(number.length<9){phone.focus();return}document.querySelector('#success-title').textContent=`${state.kind} sent`;document.querySelector('#success-copy').textContent=`${state.amount} from ${state.provider} has been sent to +27 ${number}. Demo confirmation only.`;document.querySelector('#success').classList.add('show')};document.querySelector('#back').onclick=()=>parent!==window?parent.postMessage({type:'yami:closeMiniApp'},'*'):history.back();render();
    </script>
  </body>
</html>
